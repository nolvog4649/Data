<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Look up a greeting type using a clinic password.">
  <title>Clinic Greeting Lookup</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    main { width: min(100%, 30rem); padding: 2rem; background: white; border: 1px solid #e5e8ef; border-radius: 1rem; box-shadow: 0 16px 45px rgba(42,48,83,.1); }
    h1 { margin-top: 0; }
    p { color: #657087; }
    label { display: block; margin: 1.5rem 0 .4rem; font-weight: 700; }
    input, button { width: 100%; box-sizing: border-box; padding: .8rem 1rem; border-radius: .6rem; font: inherit; }
    input { border: 1px solid #ccd2df; }
    input:focus { outline: 3px solid #dfe1ff; border-color: #5b5ce2; }
    button { margin-top: 1rem; border: 0; background: #5b5ce2; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 1.5rem; margin-top: 1rem; }
    #result { margin-top: 1rem; padding: 1rem; border-radius: .6rem; background: #eef0ff; font-size: 1.1rem; }
    .error { color: #b4233c; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Clinic Greeting Lookup</h1>
    <p>Enter a clinic password to find its associated greeting type.</p>
    <form id="lookup-form">
      <label for="password">Clinic Password</label>
      <input id="password" name="password" type="password" autocomplete="off" required>
      <button id="lookup-button" type="submit">Look up greeting</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="result" class="hidden" role="alert"></div>
  </main>

  <script>
    const SPREADSHEET_URL = 'https://raw.githubusercontent.com/nolvog4649/Data/main/Persistent%20Variable%20Sheet.xlsx';
    const form = document.querySelector('#lookup-form');
    const passwordInput = document.querySelector('#password');
    const button = document.querySelector('#lookup-button');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    let rowsPromise;

    async function loadRows() {
      if (!rowsPromise) {
        rowsPromise = fetch(SPREADSHEET_URL)
          .then(response => {
            if (!response.ok) throw new Error(`Spreadsheet request failed (${response.status})`);
            return response.arrayBuffer();
          })
          .then(buffer => {
            const workbook = XLSX.read(buffer, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            return XLSX.utils.sheet_to_json(sheet, { defval: '' });
          });
      }
      return rowsPromise;
    }

    function normalize(value) {
      return String(value ?? '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function findHeader(row, allowedNames) {
      const normalizedAllowed = allowedNames.map(name => normalize(name));
      return Object.keys(row).find(header => normalizedAllowed.includes(normalize(header)));
    }

    async function lookupGreetingType(password) {
      const rows = await loadRows();
      if (!rows.length) throw new Error('The spreadsheet contains no data rows.');

      const passwordHeader = findHeader(rows[0], ['Clinic Password', 'Password']);
      const greetingHeader = findHeader(rows[0], ['Greeting Type', 'Greeting']);

      if (!passwordHeader || !greetingHeader) {
        throw new Error('Expected columns were not found: Clinic Password and Greeting Type.');
      }

      const match = rows.find(row => normalize(row[passwordHeader]) === normalize(password));
      if (!match) {
        return null;
      }

      return match[greetingHeader];
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      result.classList.add('hidden');
      status.className = '';
      status.textContent = 'Loading spreadsheet…';
      button.disabled = true;

      try {
        const password = passwordInput.value.trim();
        if (!password) {
          throw new Error('Please enter a clinic password.');
        }

        const greetingType = await lookupGreetingType(password);

        if (!greetingType) {
          status.textContent = 'No clinic password match was found.';
          status.className = 'error';
          return;
        }

        result.textContent = `Greeting type: ${greetingType}`;
        result.classList.remove('hidden');
        status.textContent = '';
      } catch (error) {
        rowsPromise = null;
        status.textContent = error.message;
        status.className = 'error';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
